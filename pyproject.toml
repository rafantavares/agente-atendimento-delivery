[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-atendimento-delivery"
version = "0.1.0"
description = "Agente de atendimento para delivery com function calling, RAG, servidor MCP e evals."
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.30",
    "mcp>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
