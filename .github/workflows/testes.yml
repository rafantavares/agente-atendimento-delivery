# Testes a cada push e pull request. Não usam rede nem chave: o LLM é
# substituído por respostas roteirizadas e a busca usa TF-IDF.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
